<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子どものMIKATA | 沖縄ルネサンスの学び場</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
    <div class="max-w-4xl mx-auto p-8 text-center">
        <h1 class="text-4xl font-black text-slate-800 mb-6">子どものMIKATA</h1>
        <p class="text-lg text-slate-600 mb-8">沖縄ルネサンスの思想に基づき、個人の覚醒から地域社会の再生へ。</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 準備中のプログラム -->
            <div class="p-6 bg-white rounded-xl shadow-sm border border-slate-200">
                <h2 class="font-bold text-xl mb-2">源流 (Roots)</h2>
                <p>沖縄の記憶とアイデンティティ</p>
            </div>
            <div class="p-6 bg-white rounded-xl shadow-sm border border-slate-200">
                <h2 class="font-bold text-xl mb-2">結実 (Growth)</h2>
                <p>学びと成長のプログラム</p>
            </div>
        </div>
    </div>
</body>
</html>
